name: Update Profile Cards

# Generates all GitHub stat cards INSIDE this repo (./assets),
# so they always load — no dependency on rate-limited public servers.

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # run manually from the Actions tab
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/update-readme.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Needs a Personal Access Token saved as repo secret METRICS_TOKEN
      # (classic token, scopes: repo, read:user) so private repos & contributions are counted.

      - name: Stats card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/metrics-stats.svg
          output_action: commit
          committer_message: "chore: update stats card"
          config_timezone: Asia/Karachi
          base: header, activity, community, repositories
          repositories_affiliations: owner
          config_octicon: yes

      - name: Top languages card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/metrics-languages.svg
          output_action: commit
          committer_message: "chore: update languages card"
          base: ""
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 2%
          plugin_languages_ignored: html, css, scss, makefile, dockerfile, shell, cmake, c++, c, objective-c
          plugin_languages_skipped: MuhammadYaseen7799

      - name: Contribution calendar (with streaks)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/metrics-calendar.svg
          output_action: commit
          committer_message: "chore: update contribution calendar"
          config_timezone: Asia/Karachi
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Achievements card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/metrics-achievements.svg
          output_action: commit
          committer_message: "chore: update achievements card"
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
          plugin_achievements_limit: 8

  snake:
    needs: metrics
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark&color_snake=#64ffda&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Commit snake
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snake*.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update contribution snake"
          git pull --rebase origin main
          git push origin HEAD:main
